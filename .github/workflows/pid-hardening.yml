name: PID Hardening CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.26'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Build & Test telos_tui
        working-directory: telos_tui
        run: |
          go test ./...
          go build .

      - name: Build & Test telos_core/loader
        working-directory: telos_core/loader
        run: |
          go test ./...
          go build .

      - name: Build & Test telos_edge/loader
        working-directory: telos_edge/loader
        run: |
          go test ./...
          go build .

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip

      - name: Run Python unit tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
